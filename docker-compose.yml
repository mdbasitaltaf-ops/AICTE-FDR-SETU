version: '3.8'

services:
  aicte-fdr-setu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aicte_fdr_setu_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
    volumes:
      - ./data:/app/data
